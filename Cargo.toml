[workspace]
resolver = "2"
members = [
    "crates/pqc-probe-core",
    "crates/pqc-probe-cli",
    "crates/pqc-probe-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
homepage = "https://github.com/asifmahbubnaeem/pqc-probe"
readme = "README.md"
repository = "https://github.com/asifmahbubnaeem/pqc-probe"
authors = ["Asif Mahbub Naeem <asifnaim0123@gmail.com>"]

[workspace.dependencies]
pqc-probe-core = { path = "crates/pqc-probe-core", version = "0.1.0" }
csv = "1.3"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "process", "io-util", "macros", "time", "net", "sync"] }
clap = { version = "4.5", features = ["derive"] }
schemars = "1"
dns-lookup = "3.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
