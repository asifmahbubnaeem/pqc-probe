[workspace]
resolver = "2"
members = [
    "crates/pqc-probe-core",
    "crates/pqc-probe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asifmahbubnaeem/pqc-probe"
authors = ["Asif Mahbub Naeem <asifnaim0123@gmail.com>"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "process", "io-util", "macros", "time"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
